<!doctype html><html lang="ja"><head><!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Y7Q1VN1BY2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Y7Q1VN1BY2');
  /* kdm-seo-ops: contact events */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var h = a.getAttribute('href') || '';
    if (h.indexOf('tel:') === 0) gtag('event', 'tel_click', { link_url: h });
    else if (/(line\.me|lin\.ee)\//.test(h)) gtag('event', 'line_click', { link_url: a.href });
    else if (h.indexOf('mailto:') === 0) gtag('event', 'mail_click', { link_url: h });
    else if (/instagram\.com\//.test(h)) gtag('event', 'instagram_click', { link_url: a.href });
  });
</script>

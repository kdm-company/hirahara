name: Design refinement correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore exact baseline and append design-only CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          baseline_commit = 'ae504ab83e8e9d310d68b08ca8297e31ff27c5d5'
          base = subprocess.check_output(['git','show',f'{baseline_commit}:index.html']).decode('utf-8')
          css = r'''/* ===== Design refinement 2026-09-02 ===== */
          .menu-btn{background:var(--green-deep)}
          .menu-btn:hover{background:#155F07}
          .policy-card summary::after{content:"";width:9px;height:9px;margin-left:auto;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s ease;flex:0 0 auto}
          .policy-card[open] summary::after{transform:rotate(225deg)}
          .timeline h3::first-line{font-size:14px;color:var(--green-deep);letter-spacing:.08em;line-height:1.8}
          #sns{background:#fff}
          #sns .cta-card{background:linear-gradient(180deg,#fff 0%,#f1faee 100%);color:#173218;border:1px solid #d7e8d3;box-shadow:0 12px 34px rgba(23,110,8,.10)}
          #sns .cta-card::before{background:radial-gradient(circle,rgba(63,209,19,.12) 0%,rgba(63,209,19,0) 68%)}
          #sns .en{color:var(--green-deep)}
          #sns p{color:#33413a}
          #sns .cta-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px;gap:12px}
          #sns .btn{width:100%}
          #sns .btn-ghost{background:#fff;border:1.5px solid #5a9b4c;color:var(--green-deep)}
          #sns .btn-ghost:hover{background:#eaf6e7;color:var(--green-deep)}
          @media(max-width:839px){
           .hero .hero-copy{text-align:left}
           .hero .hero-name{font-size:clamp(52px,14vw,70px);left:16px}
           .hero-actions{width:100%}
           .hero-actions .btn{font-size:14px;letter-spacing:.02em;padding:12px 10px;white-space:nowrap;min-width:0}
          }
          @media(min-width:840px){
           .hero .hero-name{font-size:94px}
           #sns .cta-btns{grid-template-columns:repeat(3,minmax(0,1fr));max-width:720px}
          }
          @media(prefers-reduced-motion:reduce){.policy-card summary::after{transition:none}}
          '''
          marker='/* ===== Design refinement 2026-09-02 ===== */'
          if marker in base:
              raise SystemExit('Baseline unexpectedly already contains refinement marker')
          if base.count('</style>') != 1:
              raise SystemExit(f'Unexpected style closing count: {base.count("</style>")}')
          new = base.replace('</style>', css + '\n</style>', 1)
          if new.replace(css + '\n', '', 1) != base:
              raise SystemExit('Design patch changed more than CSS insertion')
          Path('index.html').write_text(new, encoding='utf-8')
          PY
      - name: Commit corrected design-only diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --stat
          git commit -m 'Apply design-only homepage refinement'
          git push

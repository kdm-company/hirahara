name: Embed note RSS
on:
  push:
    paths:
      - '.github/workflows/embed-note-rss.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Embed note RSS loader only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_list = '<ul class="news-list rv"><li><a href="https://note.com/hirahara508/n/n354220453320"'
          new_list = '<ul class="news-list rv" id="note-feed"><li><a href="https://note.com/hirahara508/n/n354220453320"'
          assert s.count(old_list) == 1, f'note list marker count={s.count(old_list)}'
          s = s.replace(old_list, new_list, 1)

          marker = " var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;"
          assert s.count(marker) == 1, f'script marker count={s.count(marker)}'
          rss_code = r''' var noteList=document.getElementById('note-feed');
 if(noteList){
  var noteRss='https://note.com/hirahara508/rss';
  var noteApi='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(noteRss);
  fetch(noteApi,{cache:'no-store'})
   .then(function(r){if(!r.ok)throw new Error('RSS request failed');return r.json()})
   .then(function(data){
    if(!data||data.status!=='ok'||!Array.isArray(data.items)||!data.items.length)return;
    var items=data.items.filter(function(item){return item&&typeof item.link==='string'&&/^https:\/\/note\.com\/hirahara508\/n\//.test(item.link)&&item.title}).slice(0,3);
    if(!items.length)return;
    var frag=document.createDocumentFragment();
    items.forEach(function(item,i){
     var li=document.createElement('li');
     var a=document.createElement('a');
     a.href=item.link;a.target='_blank';a.rel='noopener';
     var time=document.createElement('time');
     var m=String(item.pubDate||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
     time.textContent=m?m[1]+'.'+m[2]+'.'+m[3]:'';
     a.appendChild(time);
     if(i===0){var fresh=document.createElement('span');fresh.className='tag new';fresh.textContent='NEW';a.appendChild(fresh)}
     var tag=document.createElement('span');tag.className='tag';tag.textContent='note';a.appendChild(tag);
     var title=document.createElement('span');title.className='t';title.textContent=item.title;a.appendChild(title);
     li.appendChild(a);frag.appendChild(li);
    });
    while(noteList.firstChild)noteList.removeChild(noteList.firstChild);
    noteList.appendChild(frag);
   })
   .catch(function(){});
 }
'''
          s = s.replace(marker, rss_code + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify minimal diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "index.html"
          grep -Fq 'id="note-feed"' index.html
          grep -Fq 'https://note.com/hirahara508/rss' index.html
          grep -Fq 'https://api.rss2json.com/v1/api.json?rss_url=' index.html
          grep -Fq 'https://note.com/hirahara508/n/n354220453320' index.html
          git diff -- index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load latest note articles from RSS'
          git push

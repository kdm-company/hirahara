name: Phase 2 structure patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply structure-only patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          required=[
            '改革を、<br>暮らしの前進へ。',
            '現場の声を聞き、課題と向き合い、行動する。<br>政治の現場で培った経験を、育った兵庫の未来へ。',
            '政治を、もっと身近に。<br><span class="acc-red">暮らしを、もっと前へ。</span>',
            '大阪府で生まれ、兵庫県で育つ。',
            '最新の発信',
            'SNSでも発信しています',
            '日々の活動や地域での出来事、政治について考えていることなどを発信しています。'
          ]
          for x in required:
            if x not in s: raise SystemExit('Missing approved copy: '+x)

          nav='<nav class="gnav"><a href="#top">TOP</a><a href="#message">MESSAGE</a><a href="#profile">PROFILE</a><a href="#history">HISTORY</a><a href="#policy">POLICY</a><a href="#note">NOTE</a><a href="#sns">SNS</a><a href="#connect">お問い合わせ</a></nav>'
          s,n=re.subn(r'<nav class="gnav">.*?</nav>',nav,s,count=2,flags=re.S)
          if n!=2: raise SystemExit(f'gnav replacement count {n}')

          menu='''<div class="menu">
          <a href="#top">TOP</a>
          <a href="#message">MESSAGE</a>
          <a href="#profile">PROFILE</a>
          <a href="#history">HISTORY</a>
          <a href="#policy">POLICY</a>
          <a href="#note">NOTE</a>
          <a href="#sns">SNS</a>
          <a href="#connect">お問い合わせ</a>
          <div class="menu-sns"><a href="https://x.com/HIRAHARAKOUYA">X</a><a href="https://www.instagram.com/hiraharakouya327/">Instagram</a><a href="https://note.com/hirahara508">note</a></div>
          </div>'''
          s,n=re.subn(r'<div class="menu">.*?</div>\s*</div>',menu,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'menu replacement count {n}')

          hero_sub='<p class="hero-sub">現場の声を聞き、課題と向き合い、行動する。<br>政治の現場で培った経験を、育った兵庫の未来へ。</p>'
          if s.count(hero_sub)!=1: raise SystemExit('hero copy anchor mismatch')
          s=s.replace(hero_sub,hero_sub+'\n<div class="hero-actions"><a class="btn btn-red" href="#profile">プロフィールを見る</a><a class="btn btn-red" href="#policy">目指す政治を見る</a></div>',1)

          hr=re.compile(r'<section class="sec policy history">\s*<div class="wrap">.*?</div>\s*</section>',re.S)
          m=hr.search(s)
          if not m: raise SystemExit('history not found')
          old=m.group(0)
          paras=re.findall(r'<li><h3>.*?</h3><p>(.*?)</p></li>',old,flags=re.S)
          p1=paras[0] if len(paras)>0 else ''
          p2=paras[1] if len(paras)>1 else ''
          history=f'''<section class="sec policy history" id="history"><div class="wrap">
          <div class="sec-head rv"><p class="en">History</p><h2>これまでの歩み</h2></div>
          <ul class="timeline rv">
          <li><h3>1991年</h3>{f'<p>{p1}</p>' if p1 else ''}</li>
          <li><h3>社会人時代</h3>{f'<p>{p2}</p>' if p2 else ''}</li>
          <li><h3>政治の世界へ</h3></li>
          <li><h3>2023年</h3><p>6,136票</p></li>
          <li><h3>そして、兵庫へ</h3></li>
          </ul>
          </div></section>'''
          s=s[:m.start()]+history+s[m.end():]

          policy='''
          <section class="sec policy" id="policy"><div class="wrap">
          <div class="sec-head rv"><p class="en">Policy</p><h2>改革を、県民生活の向上へ。</h2></div>
          <div class="policy-grid rv">
          <details class="policy-card" data-policy-slot="1"><span class="num">01</span><summary>詳しく見る</summary><div class="policy-detail"></div></details>
          <details class="policy-card" data-policy-slot="2"><span class="num">02</span><summary>詳しく見る</summary><div class="policy-detail"></div></details>
          <details class="policy-card" data-policy-slot="3"><span class="num">03</span><summary>詳しく見る</summary><div class="policy-detail"></div></details>
          <details class="policy-card" data-policy-slot="4"><span class="num">04</span><summary>詳しく見る</summary><div class="policy-detail"></div></details>
          </div>
          </div></section>
          '''
          s=s.replace(history,history+policy,1)

          sr=re.compile(r'(<section class="sec cta" id="sns">.*?<div class="cta-btns">)(.*?)(</div>\s*</div></div></section>)',re.S)
          m=sr.search(s)
          if not m: raise SystemExit('sns not found')
          sns='''<a class="btn btn-red" href="https://x.com/HIRAHARAKOUYA" target="_blank" rel="noopener">X</a><a class="btn btn-ghost" href="https://www.instagram.com/hiraharakouya327/" target="_blank" rel="noopener">Instagram</a><a class="btn btn-ghost" data-sns-url="facebook" aria-disabled="true">Facebook</a><a class="btn btn-ghost" data-sns-url="threads" aria-disabled="true">Threads</a><a class="btn btn-ghost" data-sns-url="tiktok" aria-disabled="true">TikTok</a><a class="btn btn-ghost" href="https://note.com/hirahara508" target="_blank" rel="noopener">note</a>'''
          s=s[:m.start(2)]+sns+s[m.end(2):]

          connect='''
          <section class="sec cta" id="connect"><div class="wrap rv"><div class="cta-card">
          <p class="en">Connect</p><h2>平原こうやとつながる</h2>
          <div class="cta-btns"><a class="btn btn-red" href="https://lin.ee/n8yJid2T" target="_blank" rel="noopener">LINEでつながる</a><a class="btn btn-ghost" href="support.html">活動に参加する</a><a class="btn btn-ghost" href="support.html#contact">お問い合わせ</a></div>
          </div></div></section>
          '''
          ss=re.search(r'<section class="sec cta" id="sns">.*?</section>',s,re.S)
          if not ss: raise SystemExit('sns boundary not found')
          s=s[:ss.end()]+connect+s[ss.end():]

          fr=re.compile(r'<footer class="footer">.*?</footer>',re.S)
          m=fr.search(s)
          if not m: raise SystemExit('footer not found')
          footer='''<footer class="footer" id="operator"><div class="wrap">
          <p class="logo">平原こうや<small>HIRAHARA KOUYA</small></p>
          <nav class="fnav"><a href="#top">平原こうや</a><a href="#profile">プロフィール</a><a href="#policy">目指す政治・政策</a><a href="#note">活動・発信</a><a href="#sns">SNS</a><a href="#connect">お問い合わせ</a><a href="privacy.html">プライバシーポリシー</a><a href="#operator">運営者情報</a></nav>
          <p class="copy">© HIRAHARA KOUYA</p>
          </div></footer>'''
          s=s[:m.start()]+footer+s[m.end():]

          s=s.replace('.policy-grid{grid-template-columns:repeat(3,1fr);gap:22px}','.policy-grid{grid-template-columns:repeat(2,1fr);gap:22px}')
          css='''
          /* Phase 2: information architecture / routing only */
          .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:flex-end}
          .hero-actions .btn{width:auto}
          .policy-card summary{cursor:pointer;position:relative}
          .policy-detail:empty{min-height:0}
          [data-sns-url][aria-disabled="true"]{cursor:default}
          @media(max-width:839px){.hero-actions{gap:8px}.hero-actions .btn{flex:1 1 calc(50% - 4px)}}
          @media(min-width:840px){.hero-actions{justify-content:flex-start}}
          @media(min-width:840px) and (max-width:1099px){.gnav{display:none!important}.menu-btn{display:block!important}}
          '''
          if '</style>' not in s: raise SystemExit('style end missing')
          s=s.replace('</style>',css+'</style>',1)

          for x in required:
            if x not in s: raise SystemExit('Approved copy lost: '+x)
          if s.count('<li><a href="https://note.com/hirahara508/n/')!=3: raise SystemExit('NOTE list changed')
          if s.count('data-policy-slot=')!=4: raise SystemExit('Policy card count wrong')
          if '<div class="signature"' in s.split('</style>',1)[-1]: raise SystemExit('Signature returned')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Phase 2 structure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply Phase 2 homepage structure'
          git push

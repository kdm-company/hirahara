name: Set SNS links
on:
  push:
    paths:
      - '.github/workflows/set-sns-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set approved SNS links only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '<a class="btn btn-ghost" data-sns-url="facebook" aria-disabled="true">Facebook</a>': '<a class="btn btn-ghost" href="https://www.facebook.com/share/19aMJ3LEyP/?mibextid=wwXIfr" target="_blank" rel="noopener">Facebook</a>',
            '<a class="btn btn-ghost" data-sns-url="threads" aria-disabled="true">Threads</a>': '<a class="btn btn-ghost" href="https://www.threads.com/@hiraharakouya327?igshid=NTc4MTIwNjQ2YQ==" target="_blank" rel="noopener">Threads</a>',
            '<a class="btn btn-ghost" data-sns-url="tiktok" aria-disabled="true">TikTok</a>': '<a class="btn btn-ghost" href="https://www.tiktok.com/@hiraharakouya?_r=1&_t=ZS-99S4CiRe8vt" target="_blank" rel="noopener">TikTok</a>',
          }
          for old, new in replacements.items():
            assert s.count(old) == 1, f'marker count={s.count(old)}: {old}'
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify minimal diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "index.html"
          grep -Fq 'https://www.facebook.com/share/19aMJ3LEyP/?mibextid=wwXIfr' index.html
          grep -Fq 'https://www.threads.com/@hiraharakouya327?igshid=NTc4MTIwNjQ2YQ==' index.html
          grep -Fq 'https://www.tiktok.com/@hiraharakouya?_r=1&_t=ZS-99S4CiRe8vt' index.html
          ! grep -Fq 'data-sns-url="facebook"' index.html
          ! grep -Fq 'data-sns-url="threads"' index.html
          ! grep -Fq 'data-sns-url="tiktok"' index.html
          git diff -- index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set Facebook Threads and TikTok links'
          git push

name: Refresh latest note articles
on:
  push:
    paths:
      - '.github/workflows/refresh-note-latest.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh NOTE list from RSS only
        shell: python
        run: |
          from pathlib import Path
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from zoneinfo import ZoneInfo
          from html import escape
          import re

          rss_url = 'https://note.com/hirahara508/rss'
          req = urllib.request.Request(rss_url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as res:
              xml = res.read()

          root = ET.fromstring(xml)
          items = root.findall('./channel/item')[:3]
          assert len(items) == 3, f'RSS item count={len(items)}'

          rows = []
          for i, item in enumerate(items):
              title = (item.findtext('title') or '').strip()
              link = (item.findtext('link') or '').strip()
              pub = (item.findtext('pubDate') or '').strip()
              assert title and link.startswith('https://note.com/hirahara508/n/') and pub
              dt = parsedate_to_datetime(pub)
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=ZoneInfo('UTC'))
              dt = dt.astimezone(ZoneInfo('Asia/Tokyo'))
              date = dt.strftime('%Y.%m.%d')
              new_tag = '<span class="tag new">NEW</span>' if i == 0 else ''
              rows.append(
                  f'<li><a href="{escape(link, quote=True)}" target="_blank" rel="noopener">'
                  f'<time>{date}</time>{new_tag}<span class="tag">note</span>'
                  f'<span class="t">{escape(title)}</span></a></li>'
              )
              print(f'{i+1}: {date} | {title} | {link}')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          note_start = s.index('<section class="sec" id="note">')
          sns_start = s.index('<section class="sec cta" id="sns">', note_start)
          note = s[note_start:sns_start]
          pattern = r'<ul class="news-list rv">.*?</ul>'
          matches = re.findall(pattern, note, flags=re.S)
          assert len(matches) == 1, f'NOTE list count={len(matches)}'
          new_list = '<ul class="news-list rv">' + ''.join(rows) + '</ul>'
          new_note = re.sub(pattern, new_list, note, count=1, flags=re.S)
          updated = s[:note_start] + new_note + s[sns_start:]
          assert updated[:note_start] == s[:note_start]
          assert updated[note_start+len(new_note):] == s[sns_start:]
          p.write_text(updated, encoding='utf-8')
      - name: Verify minimal diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "index.html"
          test "$(grep -o 'https://note.com/hirahara508/n/' index.html | wc -l)" -eq 3
          git diff -- index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh latest note articles'
          git push

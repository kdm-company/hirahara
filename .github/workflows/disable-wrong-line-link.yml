name: Disable wrong LINE link
on:
  push:
    paths:
      - '.github/workflows/disable-wrong-line-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Disable incorrect LINE destination only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="btn btn-red" href="https://lin.ee/n8yJid2T" target="_blank" rel="noopener">LINEでつながる</a>'
          new = '<a class="btn btn-red" aria-disabled="true">LINEでつながる</a>'
          assert s.count(old) == 1, f'LINE link count={s.count(old)}'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Verify minimal diff
        shell: bash
        run: |
          git diff --check
          git diff -- index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Disable incorrect LINE link'
          git push

# note の最新記事をトップページ「最新の発信」に自動反映する。
# note の RSS をサーバー側（GitHub Actions）で取得し、index.html の #note-feed を書き換えて main に push する。
# main への push で GitHub Pages が自動デプロイするため、note を更新すると通常1時間以内にHPに反映される。
# 急ぎのときは GitHub の Actions 画面 → note feed → Run workflow で即時反映できる。
# ※ note 公式ヘルプ：「RSSを自分のサイトに埋め込む場合は、一度サーバ上で取り込んでから利用する」→ その方式。
name: note feed

on:
  schedule:
    # 1時間ごと（毎時23分）。GitHub の定期実行は毎時0分付近が混んで遅延・欠落しやすいため、0分を避けている。
    - cron: '23 * * * *'
  workflow_dispatch:          # GitHub の Actions 画面から手動実行もできる
  push:
    branches: [main]
    paths: ['.github/workflows/note-feed.yml']

permissions:
  contents: write

concurrency:
  group: note-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update note list from RSS
        run: |
          python3 - <<'PY'
          import datetime, email.utils, html, pathlib, re, sys, urllib.request
          import xml.etree.ElementTree as ET

          FEED = 'https://note.com/hirahara508/rss'
          LIMIT = 3
          JST = datetime.timezone(datetime.timedelta(hours=9))
          LINK_RE = re.compile(r'^https://note\.com/hirahara508/n/[A-Za-z0-9]+$')

          import time
          req = urllib.request.Request(FEED, headers={'User-Agent': 'Mozilla/5.0 (compatible; hiraharakouya.com note-feed)'})
          for attempt in range(3):   # 一時的な通信エラーに備えて最大3回試す
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      root = ET.fromstring(r.read())
                  break
              except Exception as e:
                  print('RSS 取得失敗（%d回目）: %s' % (attempt + 1, e))
                  if attempt == 2:
                      sys.exit('RSS を取得できませんでした（一覧は変更しません）')
                  time.sleep(20 * (attempt + 1))

          items = []
          for it in root.iter('item'):
              title = (it.findtext('title') or '').strip()
              link = (it.findtext('link') or '').strip().split('?')[0].split('#')[0]
              pub = it.findtext('pubDate')
              if not title or not pub or not LINK_RE.match(link):
                  continue
              items.append((email.utils.parsedate_to_datetime(pub).astimezone(JST), title, link))
          items.sort(key=lambda x: x[0], reverse=True)
          items = items[:LIMIT]
          if not items:
              sys.exit('RSS から記事を取得できませんでした（一覧は変更しません）')

          lis = []
          for i, (dt, title, link) in enumerate(items):
              new = '<span class="tag new">NEW</span>' if i == 0 else ''
              lis.append(
                  '<li><a href="%s" target="_blank" rel="noopener"><time>%s</time>%s'
                  '<span class="tag">note</span><span class="t">%s</span></a></li>'
                  % (html.escape(link, quote=True), dt.strftime('%Y.%m.%d'), new, html.escape(title, quote=False)))

          path = pathlib.Path('index.html')
          src = path.read_text(encoding='utf-8')
          pat = re.compile(r'(<ul class="news-list rv" id="note-feed">)(.*?)(</ul>)', re.S)
          if len(pat.findall(src)) != 1:
              sys.exit('index.html に #note-feed が見つかりません')
          out = pat.sub(lambda m: m.group(1) + ''.join(lis) + m.group(3), src)
          if out != src:
              path.write_text(out, encoding='utf-8')
          for dt, title, link in items:
              print(dt.strftime('%Y.%m.%d %H:%M'), title, link)
          PY

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m 'note の最新記事を反映'
          else
            # 60日間リポジトリに動きがないと GitHub が定期実行を自動停止するため、
            # 記事更新が長く途絶えたときだけ空コミットで定期実行を維持する。
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
              git commit --allow-empty -m 'note 自動反映の定期実行を維持（記事更新なし）'
            else
              echo '変更なし'; exit 0
            fi
          fi
          git pull --rebase origin main
          git push origin HEAD:main

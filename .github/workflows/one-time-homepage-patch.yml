name: One-time homepage patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run one-time homepage patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch homepage copy and remove duplicate Message signature
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('<h1 class="hero-catch">日々の暮らしと、<br>想うことを。</h1>', '<h1 class="hero-catch">改革を、<br>暮らしの前進へ。</h1>'),
              ('<p class="hero-sub">SNSやnoteでの発信を、このページにまとめています。</p>', '<p class="hero-sub">現場の声を聞き、課題と向き合い、行動する。<br>政治の現場で培った経験を、育った兵庫の未来へ。</p>'),
              ('<h2>日々の暮らしの中で、<br><span class="acc-red">感じたことを大切に。</span></h2>', '<h2>政治を、もっと身近に。<br><span class="acc-red">暮らしを、もっと前へ。</span></h2>'),
              ('<p>兵庫で生まれ育ち、会社員として働く中で、日々の暮らしや人との出会いを大切にしてきました。ここでは、そうした日常の中で感じたことや近況を、飾らない言葉でお伝えしていきます。</p>', '<p>政治は、特別な人たちだけのものではありません。<br><br>毎日の暮らし、子育て、教育、仕事、地域の未来。<br>私たちの生活のすぐそばにあるものだと考えています。<br><br>これまで会社員として働き、国政・地方政治の現場で秘書として経験を重ね、2023年には自ら選挙にも挑戦しました。<br><br>政治の内側と外側、その両方を経験してきたからこそ、制度や数字だけではなく、一人ひとりの暮らしから政治を考えていきたい。<br><br>現場に足を運び、声を聞き、自分の言葉で伝え、行動する。<br><br>改革を、県民生活の向上につなげる政治へ。<br><br>これからも、一歩ずつ前へ進んでいきます。</p>'),
              ('<p class="prof-text">兵庫で生まれ育ち、会社員として働いてきました。日々の暮らしの中で感じたことを大切に、これからも自分の言葉で発信を続けていきます。</p>', '<p class="prof-text">大阪府で生まれ、兵庫県で育つ。<br><br>会社員として社会人経験を積んだ後、衆議院議員公設秘書、参議院議員私設秘書、大阪維新の会副代表秘書など、国政・地方政治の現場で経験を重ねてきました。<br><br>2023年には大阪市会議員選挙に挑戦。<br><br>これまで培ってきた経験を、育った兵庫の未来のために生かしたい。<br><br>地域を歩き、さまざまな声に耳を傾けながら、次の時代の政治を目指して活動しています。</p>'),
              ('<li><h3>兵庫県で生まれ育つ</h3><p>地域とともにある暮らしの中で育ちました。</p></li>', '<li><h3>大阪府で生まれ、兵庫県で育つ</h3><p>大阪府で生まれ、兵庫県で育ちました。人生の長い時間を兵庫で過ごし、地域の中で成長してきました。</p></li>'),
              ('<h2>SNSで発信しています</h2>', '<h2>SNSでも発信しています</h2>'),
              ('<p>日々の様子はX・Instagram・noteで発信しています。よろしければフォローしてください。</p>', '<p>日々の活動や地域での出来事、政治について考えていることなどを発信しています。</p>'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:80]}')
              text = text.replace(old, new, 1)

          section_start = text.index('<section class="sec message" id="message">')
          section_end = text.index('</section>', section_start)
          message = text[section_start:section_end]
          signature = '<div class="signature"><span class="name">平原 こうや</span></div>'
          if message.count(signature) != 1:
              raise SystemExit(f'Expected exactly one Message signature, found {message.count(signature)}')
          message = message.replace(signature, '', 1)
          text = text[:section_start] + message + text[section_end:]

          path.write_text(text, encoding='utf-8')

      - name: Commit homepage patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --exit-code && exit 0
          git commit -m "Apply approved homepage copy and remove duplicate Message signature"
          git push
